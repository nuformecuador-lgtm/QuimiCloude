<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Iniciar sesión</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./qc.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="{{ rootCls }}">
  <div class="scroller" style="background: var(--side)">
    <div style="position: relative; min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 40px 16px; overflow: hidden">
      <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; color: rgb(255 255 255 / 0.13)">
        <svg style="position: absolute; left: 4%; top: 8%; width: 140px; height: 140px; animation: qc-spin 70s linear infinite" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="21,10.5 32.7,17.3 32.7,30.8 21,37.5 9.3,30.8 9.3,17.3"></polygon><path d="M32.7 30.8 40.9 35.5"></path><circle cx="40.9" cy="35.5" r="3" fill="currentColor"></circle></svg>
        <svg style="position: absolute; right: 7%; top: 12%; width: 96px; height: 96px; animation: qc-spin 55s linear infinite reverse" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4"><polygon points="21,10.5 32.7,17.3 32.7,30.8 21,37.5 9.3,30.8 9.3,17.3"></polygon><path d="M9.3 17.3 3.3 13.8"></path><circle cx="3.3" cy="13.8" r="3" fill="currentColor"></circle></svg>
        <svg style="position: absolute; right: 4%; bottom: 6%; width: 170px; height: 170px; animation: qc-spin 90s linear infinite" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="21,10.5 32.7,17.3 32.7,30.8 21,37.5 9.3,30.8 9.3,17.3"></polygon><path d="M14.5 26.7v-5.4M21.9 17l4.7 2.7"></path></svg>
        <svg style="position: absolute; left: 10%; bottom: 10%; width: 80px; height: 80px; animation: qc-spin 48s linear infinite reverse" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="16" cy="24" r="6"></circle><circle cx="34" cy="16" r="4"></circle><circle cx="34" cy="34" r="4"></circle><path d="M21.5 21.5 30.5 17.5M21.5 26.5 30.5 32.5"></path></svg>
        <svg style="position: absolute; left: 46%; top: 3%; width: 60px; height: 60px; animation: qc-spin 40s linear infinite" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6"><polygon points="21,10.5 32.7,17.3 32.7,30.8 21,37.5 9.3,30.8 9.3,17.3"></polygon></svg>
      </div>

      <main class="card enter" style="position: relative; width: min(400px, 100%); padding: 32px 28px 20px; gap: 20px; border-radius: 18px; box-shadow: var(--shadow-dlg)" aria-labelledby="lg-h">
        <h1 id="lg-h" style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px"><img src="/_blob/f9f03873139f42e5e761f3e112cb67d9" alt="" style="width: 56px; height: 56px"><span style="font-size: 24px; font-weight: 500; letter-spacing: -0.01em">Quimi<span style="color: var(--primary); font-weight: 600">Cloude</span></span></h1>
        <div class="f"><label for="lg-u">Usuario</label><input id="lg-u" class="in in-touch" type="text" autocomplete="username" value="cmrestrepo"></div>
        <div class="f"><label for="lg-p">Contraseña</label>
          <div class="pw"><input id="lg-p" class="in in-touch" type="{{ pwType }}" autocomplete="current-password" value="secreto123"><button class="pw-eye" type="button" aria-controls="lg-p" aria-pressed="{{ showStr }}" aria-label="{{ eyeLabel }}" onClick="{{ toggleEye }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path><path class="eye-slash" d="M3 3l18 18"></path></svg></button></div>
        </div>
        <button class="b b-pri b-touch b-block" type="button" aria-busy="{{ busyStr }}" aria-disabled="{{ busyStr }}" onClick="{{ login }}"><sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}"><svg class="ic spin" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.56"></path></svg></sc-if>{{ loginLabel }}</button>
        <div style="display: flex; justify-content: center; padding-top: 12px; border-top: 1px solid var(--border)"><a class="b b-lnk" href="#" style="min-height: 44px">¿Olvidaste tu contraseña?</a></div>
      </main>
    </div>
  </div>

  <div class="toastwrap" aria-live="assertive"><div class="{{ toastCls }}" role="alert"><svg class="ic ic-lg" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--d-fg)"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 8v5M12 16h.01"></path></svg><span>Usuario o contraseña incorrectos.</span></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"oscuro":{"editor":"boolean","default":false},"errorVisible":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
componentWillUnmount() { clearTimeout(this.t); clearTimeout(this.t2); }
renderVals() {
const s = this.state || {};
const dark = !!this.props.oscuro;
const show = !!s.show;
const busy = !!s.busy;
const toast = s.toast !== undefined ? s.toast : !!this.props.errorVisible;
return {
rootCls: dark ? 'qc app dk' : 'qc app',
pwType: show ? 'text' : 'password',
showStr: show ? 'true' : 'false',
eyeLabel: show ? 'Ocultar la contraseña' : 'Mostrar la contraseña',
toggleEye: () => this.setState({ show: !show }),
busy: busy, busyStr: busy ? 'true' : 'false',
loginLabel: busy ? 'Entrando…' : 'Entrar',
login: () => {
if (busy) return;
this.setState({ busy: true, toast: false });
clearTimeout(this.t); clearTimeout(this.t2);
this.t = setTimeout(() => {
this.setState({ busy: false, toast: true });
this.t2 = setTimeout(() => this.setState({ toast: false }), 3600);
}, 1300);
},
toastCls: toast ? 'toast show' : 'toast'
};
}
}
</script>
</body>
</html>
